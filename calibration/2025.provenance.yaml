# Provenance for calibration/2025.yaml, one entry per banded stat:
# which method built its curve, from which dataset, and how many
# players/anchors that produced. Generated by poc/build_calibration.py -
# do not hand-edit. tests/test_calibrate.py::test_every_curve_stat_has_provenance_and_vice_versa
# keeps this file and calibration/2025.yaml's stat keys from drifting apart.
#
# CORRECTED 2026-08-30 (hand-edit, player_count only): four weekly-data
# files carried the same real entity under two player_ids (byte-identical
# week-by-week stats) - TQB.full.csv Eagles, WR.full.csv Jaxon
# Smith-Njigba, DST.full.csv Vikings, and build-set RB.csv TreVeyon
# Henderson + Kyle Monangai. `sffl.weekly.load_weekly` now collapses these
# at load (see its module docstring), so player_count below is the
# corrected, de-duplicated figure for pass_cmp/pass_yds (TQB, -1),
# rec_ct/rec_yds (WR -1, RB -2), and rush_yds (RB -2, TQB -1, WR -1).
# anchor_count is UNCHANGED for every stat - `build_curves`/
# `build_curves_isotonic` merge anchors by rounded mean, so the duplicate
# rows already collapsed into the same anchor and never affected
# calibration/2025.yaml, which is why that file is not touched here.
# def_pa/def_ya's player_count is also unchanged (4): their build-set-only
# DST.csv has no duplicate id - only the held-back DST.full.csv does, and
# that file is not part of their build.
def_pa:
  anchor_count: 3
  dataset: build_set_only
  method: build_curves
  note: 'excluded from isotonic/full-dataset adoption: structurally inert on the board
    (DST sits in flat_priced_pools, so this curve never reaches _dollars) and its
    weekly-path behaviour was never covered by any pre-registered gate'
  player_count: 4
def_ya:
  anchor_count: 4
  dataset: build_set_only
  method: build_curves
  note: 'excluded from isotonic/full-dataset adoption: structurally inert on the board
    (DST sits in flat_priced_pools, so this curve never reaches _dollars) and its
    weekly-path behaviour was never covered by any pre-registered gate'
  player_count: 4
pass_cmp:
  anchor_count: 29
  dataset: build_set_plus_held_back
  method: build_curves_isotonic
  player_count: 31
pass_yds:
  anchor_count: 31
  dataset: build_set_plus_held_back
  method: build_curves_isotonic
  player_count: 31
rec_ct:
  anchor_count: 52
  dataset: build_set_plus_held_back
  method: build_curves_isotonic
  player_count: 74
rec_yds:
  anchor_count: 73
  dataset: build_set_plus_held_back
  method: build_curves_isotonic
  player_count: 74
rush_yds:
  anchor_count: 79
  dataset: build_set_plus_held_back
  method: build_curves_isotonic
  player_count: 105
