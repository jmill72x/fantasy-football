name: footballguys
files: ["projection-set-*.csv"]
by_index: false
columns:
  name: name
  team: team
  pos: pos
  games: ssn-gms
  set_name: set-name
  pass_cmp: pass-cmp
  pass_yds: pass-yds
  pass_td: pass-td
  pass_int: pass-int
  pass_2pt: pass-2pt
  rush_yds: rush-yds
  rush_td: rush-td
  rush_2pt: rush-2pt
  rec_ct: rec-rec
  rec_yds: rec-yds
  rec_td: rec-td
  rec_2pt: rec-2pt
  xp_made: kck-xpc
  def_pa: tmd-pa
  def_ya: tmd-ya
  def_sack: tmd-sck
  def_int: tmd-int
  def_fum_rec: tmd-fmr
  def_td: tmd-td
  def_safety: tmd-saf
filters:
  # pk (kicker) excluded: this vendor supplies only total field goals made
  # (kck-fgc), not the by-distance split the league's scoring requires
  # (fg_u30/fg_30_39/fg_40_49/fg_50_59/fg_60) - see
  # capabilities.provides_fg_distance_bands below. Ingesting pk rows here
  # would silently score every kicker on XPs alone, a ~3.7x undercount we'd
  # otherwise report as fact. Get kickers from a source that provides the
  # bands (e.g. draftsharks) instead.
  pos: ["qb", "rb", "wr", "te", "td"]
capabilities:
  provides_fg_distance_bands: false
  provides_two_point: true
  provides_def_safety: true
  multi_set: true
