# Column maps for the CBS league site's weekly projections table
# (Players -> PROJECTIONS -> TIMEFRAME: WEEK n (PROJ)).
#
# READ RIGHT TO LEFT. The identity prefix is parsed by regex from the left, but
# the stat block is taken from the RIGHT because EXPERT - which sits between
# them - is "N/R" for unranked players. Counting from the left would shift
# every stat after it by one and produce a plausible wrong line.
#
# `stats` lists the trailing fields in order. A name of `_` is a column the
# scoring engine does not use (averages, the site's own FPTS).
#
# A NAME MAY APPEAR MORE THAN ONCE IN A GROUP'S `stats:` LIST - those columns
# are SUMMED into that one key. This is how a stat CBS splits across multiple
# columns (e.g. a kicker group's `fg_under_30`, which CBS prints as separate
# `1-19` and `20-29` columns) gets combined into the single number the
# scoring engine expects. `_` is exempt from this: repeating `_` still
# discards every one of those columns and never creates a stat named `_`.
groups:
  RB-WR-TE:
    stats: [rush_att, rush_yds, _, rush_td, tgt, rec_ct, rec_yds, _, rec_td,
            fum_lost, _]
    # Total whitespace-separated tokens after the team code: 6 preamble
    # (OPP OVP BYE ROST START EXPERT) + 11 stats. Reading the stat block from
    # the RIGHT survives a non-numeric EXPERT, but it CANNOT detect a column
    # being added or removed - the slice just returns a different 11 columns,
    # every one of them plausible. This is the check that catches that.
    expect_tokens: 17

# The league's manager abbreviations, exactly as CBS prints them in the
# leftmost column of the ALL PLAYERS view.
#
# ENUMERATED, NOT PATTERN-MATCHED, ON PURPOSE. A pattern loose enough to accept
# a two-letter abbreviation ("JM") also accepts the two-initial first name of a
# row that is MISSING its status token - "DJ Moore WR - CHI" parses as
# avail="DJ", name="Moore", quietly filing a real player's stats under a
# fabricated one. That is F4, and it was found in real data. A closed list
# cannot do that: an unknown token fails to match and is reported by the
# unmatched-line count instead.
#
# WHEN A MANAGER JOINS OR LEAVES, ADD OR REMOVE THEIR CODE HERE. The failure if
# you forget is loud - the page is refused and the offending line is named.
#
# PLACEHOLDER - NOT YET FILLED FROM A REAL PAGE. No captured in-season page
# exists yet (the CBS login that would produce one is a manual step the repo
# owner has not completed), so the real twelve manager codes are unknown. Do
# NOT guess plausible-looking abbreviations here - a fabricated code that
# happens to collide with a real player's initials would silently recreate
# F4. Once a real page is captured, replace this list by running:
#   awk '{print $1}' data/captures/projections.txt | sort -u
# and keeping the tokens that are manager abbreviations, discarding `FA` and
# `W`.
owner_codes:
